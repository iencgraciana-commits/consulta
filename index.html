<script>

let estudiantes = [];
let encabezados = [];

fetch("estudiantes.csv")
.then(response => response.text())

.then(data => {

    let filas = data.trim().split(/\r?\n/);

    encabezados = filas[0]
        .replace(/\uFEFF/g, "")
        .split(";")
        .map(e => e.trim());

    filas.shift();

    filas.forEach(fila => {

        let columnas = fila.split(";");

        let estudiante = {};

        encabezados.forEach((titulo, index) => {

            estudiante[titulo] =
                columnas[index]?.trim() || "";
        });

        estudiantes.push(estudiante);
    });

    console.log(estudiantes);
})

.catch(error => {

    console.log(error);

    document.getElementById("resultado").innerHTML =
        "<p class='error'>Error cargando estudiantes.csv</p>";
});

function login() {

    let doc =
        document.getElementById("documento")
        .value
        .trim();

    let clave =
        document.getElementById("clave")
        .value
        .trim();

    let resultado =
        document.getElementById("resultado");

    let estudiante = estudiantes.find(e =>

        e["Documento"] == doc &&
        e["Clave"] == clave
    );

    if (estudiante) {

        let html = "";

        html += `
            <h3>
                ${estudiante["Apellidos y Nombres de Estudiantes"]}
            </h3>
        `;

        html += `
            <p>
                <strong>Debe asistir a reunión:</strong>
                ${estudiante["REUNION"]}
            </p>
        `;

        html += "<table>";

        html += `
            <tr>
                <th>Materia</th>
                <th>Nota</th>
            </tr>
        `;

        for (let i = 4; i < encabezados.length; i++) {

            let materia = encabezados[i];

            let nota = estudiante[materia];

            let clase = "";

            let valor = parseFloat(
                String(nota).replace(",", ".")
            );

            if (!isNaN(valor)) {

                if (valor < 3) {

                    clase = "baja";

                } else if (valor < 4) {

                    clase = "media";

                } else {

                    clase = "alta";
                }
            }

            html += `
                <tr class="${clase}">
                    <td>${materia}</td>
                    <td>${nota}</td>
                </tr>
            `;
        }

        html += "</table>";

        resultado.innerHTML = html;

    } else {

        resultado.innerHTML = `
            <p class="error">
                Documento o clave incorrectos
            </p>
        `;
    }
}

</script>
