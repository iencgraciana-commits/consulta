<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consulta Académica</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#2b5876,#4e4376);
    margin:0;
    padding:20px;
    text-align:center;
    color:white;
}

.contenedor{
    background:white;
    color:black;
    max-width:900px;
    margin:auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 10px 25px rgba(0,0,0,0.3);
}

h2{
    margin-top:0;
}

input{
    width:260px;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    margin:5px;
    font-size:16px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#4e4376;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#2b5876;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#4e4376;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.baja{
    background:#ffcccc;
}

.media{
    background:#fff3cd;
}

.alta{
    background:#d4edda;
}

.error{
    color:red;
    font-weight:bold;
    margin-top:20px;
}

.info{
    margin-top:20px;
    font-size:18px;
}

</style>

</head>

<body>

<div class="contenedor">

    <h2>Ingreso al Sistema Académico</h2>

    <input type="text" id="documento" placeholder="Documento">

    <br>

    <input type="password" id="clave" placeholder="Clave">

    <br><br>

    <button onclick="login()">
        Ingresar
    </button>

    <div id="resultado"></div>

</div>

<script>

let estudiantes = [];
let encabezados = [];

fetch("estudiantes.csv")
.then(response => response.text())

.then(data => {

    let filas = data.trim().split(/\r?\n/);

    encabezados = filas[0]
        .split(";")
        .map(e => e.trim());

    filas.shift();

    filas.forEach(fila => {

        let columnas = fila.split(";");

        let estudiante = {};

        encabezados.forEach((titulo,index) => {

            estudiante[titulo] =
                columnas[index]?.trim() || "";
        });

        estudiantes.push(estudiante);
    });

    console.log(estudiantes);

})

.catch(error => {

    console.log(error);

    document.getElementById("resultado").innerHTML =
        "<p class='error'>Error cargando estudiantes.csv</p>";
});

function login(){

    let doc =
        document.getElementById("documento")
        .value
        .trim();

    let clave =
        document.getElementById("clave")
        .value
        .trim();

    let resultado =
        document.getElementById("resultado");

    let estudiante = estudiantes.find(e =>

        e["Documento"]?.trim() === doc &&
        e["Clave"]?.trim() === clave
    );

    if(estudiante){

        let tabla = "";

        tabla += `
            <div class="info">
                <strong>Estudiante:</strong>
                ${estudiante["Apellidos y Nombres de Estudiantes"]}
                <br><br>

                <strong>¿Debe asistir a reunión?</strong>
                ${estudiante["¿DEBE ASISTIR A RUNION 29/05/2026"]}
            </div>
        `;

        tabla += "<table>";

        tabla += `
            <tr>
                <th>Materia</th>
                <th>Nota</th>
            </tr>
        `;

        for(let i = 4; i < encabezados.length; i++){

            let materia = encabezados[i];

            let nota = estudiante[materia];

            let clase = "";

            let valor = parseFloat(
                String(nota).replace(",", ".")
            );

            if(!isNaN(valor)){

                if(valor < 3){

                    clase = "baja";

                }else if(valor < 4){

                    clase = "media";

                }else{

                    clase = "alta";
                }
            }

            tabla += `
                <tr class="${clase}">
                    <td>${materia}</td>
                    <td>${nota}</td>
                </tr>
            `;
        }

        tabla += "</table>";

        resultado.innerHTML = tabla;

    }else{

        resultado.innerHTML = `
            <p class="error">
                Documento o clave incorrectos
            </p>
        `;
    }
}

</script>

</body>
</html>
